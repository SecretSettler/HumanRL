name: intenttrace

x-app-build: &app-build
  context: .
  dockerfile: infra/Dockerfile

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  LOG_LEVEL: info
  APP_VERSION: 0.0.0
  GIT_COMMIT: development
  DATABASE_URL: postgres://intenttrace:intenttrace@postgres:5432/intenttrace
  ARTIFACT_ROOT: /var/lib/intenttrace/artifacts
  PROVIDER_MODE: mock
  PROVIDER_EGRESS_ENABLED: "false"

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: intenttrace
      POSTGRES_USER: intenttrace
      POSTGRES_PASSWORD: intenttrace
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intenttrace -d intenttrace"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: *app-build
    command: ["node", "packages/db/dist/migrate.js"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *app-build
    command: ["node", "apps/api/dist/main.js"]
    environment:
      <<: *runtime-environment
      API_HOST: 0.0.0.0
      API_PORT: 3001
    expose:
      - "3001"
    volumes:
      - artifact-data:/var/lib/intenttrace/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/readyz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: *app-build
    command: ["node", "apps/worker/dist/main.js"]
    environment: *runtime-environment
    volumes:
      - artifact-data:/var/lib/intenttrace/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Graceful shutdown worst case: summaryJobBudgetMs(PROVIDER_TIMEOUT_MS
    # 30000) = 60s, plus SHUTDOWN_POOL_TIMEOUT_SECONDS 5s, plus
    # SHUTDOWN_FORCE_EXIT_DELAY_MS 1s = 66s. Raising PROVIDER_TIMEOUT_MS
    # requires raising this too.
    stop_grace_period: 75s
    restart: unless-stopped

  web:
    build: *app-build
    command: ["node", "apps/web/server.js"]
    environment:
      NODE_ENV: production
      INTENTTRACE_API_ORIGIN: http://api:3001
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${INTENTTRACE_WEB_PORT:-}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  artifact-data:
