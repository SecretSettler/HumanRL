name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: intenttrace
          POSTGRES_USER: intenttrace
          POSTGRES_PASSWORD: intenttrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intenttrace -d intenttrace"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://intenttrace:intenttrace@127.0.0.1:5432/intenttrace
      PROVIDER_MODE: mock
      PROVIDER_EGRESS_ENABLED: "false"
      # `pnpm build`, `dev` and `typecheck` are `turbo run`; both vendors enable
      # telemetry by default, so the gate opts out the same way the images do.
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      # pnpm must exist before setup-node runs: `cache: pnpm` shells out to pnpm
      # to resolve the store path, so installing it afterwards fails the step.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      # @intenttrace/desktop's typecheck and build both run the Tauri bundle
      # preflight, which asserts the stack archive exists. The archive is
      # generated, not committed, so it has to be built before those steps.
      - run: pnpm desktop:prepare
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contract
      # playwright.config.ts declares no explicit projects, so the run uses the
      # default chromium project only.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm docs:check
      - run: pnpm schema:check
      - run: pnpm docker:check
      - run: pnpm db:migrate && pnpm db:migrate
